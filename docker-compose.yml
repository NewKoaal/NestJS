version: "3.9"

services:
  db:
    image: postgres:16
    container_name: backend_test_postgres
    restart: always
    environment:
      POSTGRES_USER: nestjs
      POSTGRES_PASSWORD: nestjsdb
      POSTGRES_DB: appdb
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend_test
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: npm run start:dev

  pgadmin:
    image: dpage/pgadmin4
    container_name: backend_test_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
